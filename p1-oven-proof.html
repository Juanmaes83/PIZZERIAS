<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P1.3 · Oven Visual Proof</title>
<style>
:root{--ink:#070605;--line:rgba(255,255,255,.14);--accent:#f2c66d;--muted:#aaa197}*{box-sizing:border-box}html,body{margin:0;background:#070605;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}.shell{width:min(1500px,100%);margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#d4b07f}.head h1{font:400 clamp(32px,5vw,70px)/.95 Georgia,serif;margin:6px 0}.status{border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:11px;letter-spacing:.12em;white-space:nowrap}.oven-stage{position:relative;height:min(68vw,760px);min-height:560px;overflow:hidden;border:1px solid var(--line);background:#090706}.oven-photo{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;z-index:0}.stage-grade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.11) 70%,rgba(0,0,0,.32))}.contact-shadow{position:absolute;left:50%;bottom:17%;width:26%;height:5%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.8),transparent 72%);filter:blur(7px);opacity:0;z-index:4;transition:opacity .18s ease}.oven-stage.is-contacting .contact-shadow{opacity:.9}.peel{position:absolute;left:50%;bottom:2%;width:min(78%,1050px);height:30%;transform:translate(60%,18%) rotate(-1.5deg) scale(.96);transform-origin:92% 52%;opacity:0;z-index:5;will-change:transform,opacity,filter}.peel-handle{position:absolute;right:0;top:48%;width:74%;height:12px;border-radius:999px;background:linear-gradient(180deg,#755237,#2a1a12);box-shadow:0 8px 18px rgba(0,0,0,.55)}.peel-head{position:absolute;left:0;top:1%;width:30%;aspect-ratio:1.4;border-radius:45% 45% 26% 26%;background:linear-gradient(145deg,#b6b0a6,#45413c);box-shadow:0 30px 45px rgba(0,0,0,.55);display:grid;place-items:center;transform:perspective(520px) rotateX(10deg);transform-origin:center 70%}.peel-head:after{content:'';position:absolute;inset:8%;border:1px solid rgba(255,255,255,.18);border-radius:inherit}.peel-head img{width:86%;aspect-ratio:1;object-fit:cover;border-radius:50%;opacity:0;box-shadow:0 16px 30px rgba(0,0,0,.55)}.foreground-product{position:absolute;inset:0;z-index:10;display:grid;grid-template-columns:1.05fr .8fr;align-items:center;gap:5vw;padding:5vw 6vw;opacity:0;visibility:hidden;background:linear-gradient(90deg,rgba(5,4,3,.18),rgba(5,4,3,.62) 58%,rgba(5,4,3,.88));backdrop-filter:blur(2px)}.foreground-product img{width:min(48vw,620px);aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 45px 90px rgba(0,0,0,.62);transform:translateY(8%) scale(.9);opacity:0;transition:transform .55s cubic-bezier(.18,.8,.2,1),opacity .35s ease}.foreground-copy{transform:translateX(28px);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1) .12s,opacity .4s ease .12s}.foreground-product.is-visible img{transform:translateY(0) scale(1);opacity:1}.foreground-product.is-visible .foreground-copy{transform:none;opacity:1}.foreground-copy h2{font:400 clamp(48px,7vw,105px)/.9 Georgia,serif;margin:8px 0}.foreground-copy p:not(.eyebrow){color:#c0b8af;line-height:1.6}.foreground-copy strong{display:block;color:var(--accent);font-size:27px;margin:24px 0}.foreground-copy button,.pizza-btn,.playback button{border:1px solid #332e29;background:#15120f;color:#ddd;border-radius:999px;padding:11px 16px;cursor:pointer}.foreground-copy button{background:#fff;color:#111}.controls{display:grid;grid-template-columns:1.2fr .45fr;gap:14px;margin-top:14px}.pizza-picker,.playback,.telemetry{border:1px solid var(--line);padding:13px;background:rgba(255,255,255,.025)}.pizza-picker{display:flex;gap:8px;flex-wrap:wrap}.pizza-btn.active,.playback .primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}.playback{display:flex;gap:8px;justify-content:flex-end;align-items:center}.telemetry{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.telemetry span{display:block;color:#776f68;font-size:8px;text-transform:uppercase;letter-spacing:.14em}.telemetry strong{display:block;margin-top:5px;font-size:11px}.proof{position:absolute;left:16px;top:16px;z-index:20;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:999px;padding:9px 12px;font-size:10px;letter-spacing:.12em}.proof b{color:#8ef0a0}.asset-error .proof b{color:#ff7c72}.asset-error .oven-photo{display:none}.asset-error .oven-stage{background:#160706}@media(max-width:800px){.shell{padding:10px}.head{align-items:flex-start;flex-direction:column}.oven-stage{height:72vh;min-height:560px}.oven-photo{object-position:center center}.peel{width:120%;bottom:11%}.controls{grid-template-columns:1fr}.playback{justify-content:flex-start}.telemetry{grid-template-columns:1fr 1fr}.foreground-product{grid-template-columns:1fr;padding:24px;align-content:center}.foreground-product img{width:min(70vw,420px);margin:auto}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div><p class="eyebrow">P1.3 · VISUAL PROOF</p><h1>Premium oven + approved P1.2 mechanics</h1></div><div class="status"><span id="status-label">IDLE</span></div></header>
<section class="oven-stage" aria-label="Horno premium funcionando">
  <img id="oven-photo" class="oven-photo" src="./assets/oven/p1-oven-master.webp" alt="Horno de leña premium">
  <div class="stage-grade"></div>
  <div class="proof">OVEN ASSET · <b id="asset-state">LOADING</b></div>
  <div class="contact-shadow" aria-hidden="true"></div>
  <div id="peel" class="peel" aria-hidden="true"><div class="peel-handle"></div><div class="peel-head"><img id="peel-pizza" alt=""></div></div>
  <div id="foreground-product" class="foreground-product" aria-live="polite"><img id="foreground-image" alt=""><div class="foreground-copy"><p id="foreground-kicker" class="eyebrow"></p><h2 id="foreground-name"></h2><p id="foreground-desc"></p><strong id="foreground-price"></strong><button id="choose-another" type="button">Elegir otra</button></div></div>
</section>
<section class="controls">
<div class="pizza-picker"><button data-pizza="margherita" class="pizza-btn active">Margherita</button><button data-pizza="diavola" class="pizza-btn">Diavola</button><button data-pizza="mortadella" class="pizza-btn">Mortadella & Pistachio</button></div>
<div class="playback"><button id="play" class="primary" type="button">PLAY OVEN</button><button id="reset" type="button">RESET</button></div>
<div class="telemetry"><div><span>Selected pizza</span><strong id="telemetry-pizza">pizza-margherita</strong></div><div><span>Resolved media</span><strong id="telemetry-media">placeholder</strong></div><div><span>State</span><strong id="telemetry-state">IDLE</strong></div><div><span>Oven</span><strong id="telemetry-oven">checking</strong></div></div>
</section>
</main>
<script src="p0-media-registry.js"></script>
<script>
const oven=document.getElementById('oven-photo'),assetState=document.getElementById('asset-state'),telemetryOven=document.getElementById('telemetry-oven');
function ovenReady(){document.body.classList.remove('asset-error');assetState.textContent='VISIBLE';telemetryOven.textContent=`visible ${oven.naturalWidth}×${oven.naturalHeight}`}
function ovenError(){document.body.classList.add('asset-error');assetState.textContent='ERROR';telemetryOven.textContent='asset failed'}
oven.addEventListener('load',ovenReady);oven.addEventListener('error',ovenError);if(oven.complete){oven.naturalWidth?ovenReady():ovenError()}
</script>
<script src="p1-oven-lab.js"></script>
</body>
</html>
